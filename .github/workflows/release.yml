# Tests on every push; a release (BuildBook.zip + the Windows installer) for every version tag.
# Push a version tag (git tag v1.0 && git push origin v1.0), or run it by hand from the Actions tab.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0)"
        required: true

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline tests (the pure-Python modules)
        run: python -m unittest discover -s BuildBook/tests -v

  zip:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build BuildBook.zip
        run: |
          mkdir -p dist
          zip -r -q dist/BuildBook.zip BuildBook \
            -x "BuildBook/logs/*" "BuildBook/cache/*" "BuildBook/thumbs/*" "BuildBook/tests/*" "BuildBook/tools/*" \
               "*/__pycache__/*" "*.pyc"
          cp install/install.ps1 install/install.sh dist/

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --title "BuildBook $TAG" --generate-notes --target "$GITHUB_SHA"

  # The Windows installer (.exe): Inno Setup, installs for the current user without admin rights.
  # Built on pushes to main too (kept with the run), so a broken installer shows up before a release.
  installer:
    needs: [tests, zip]
    if: always() && needs.tests.result == 'success' && github.event_name != 'pull_request' && (needs.zip.result == 'success' || needs.zip.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build the installer
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = if ($tag -like "v*") { $tag.Substring(1) } else { "test" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" install\BuildBook.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - name: Keep it with the run
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

      - name: Attach it to the release
        if: needs.zip.result == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload $tag (Get-ChildItem dist\*.exe).FullName --clobber
